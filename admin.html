<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Projeto Cristão</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <!-- Tela de Login -->
    <main id="login-section" class="login-wrapper">
        <div class="form-container login-box">
            <div class="text-center" style="margin-bottom: var(--spacing-6);">
                <h1 style="font-size: var(--font-size-2xl); margin-bottom: var(--spacing-2); color: var(--color-primary);">Painel Administrativo</h1>
                <p class="text-muted">Faça login para visualizar os inscritos.</p>
            </div>
            
            <form id="form-login">
                <div class="form-group">
                    <label for="username" class="form-label">Usuário</label>
                    <input type="text" id="username" class="form-input" required>
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">Senha</label>
                    <input type="password" id="password" class="form-input" required>
                </div>
                
                <div id="login-error" class="error-message text-center" style="margin-bottom: var(--spacing-4);">
                    Credenciais inválidas.
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%;">Entrar</button>
            </form>
        </div>
    </main>

    <!-- Painel Principal (Oculto até login) -->
    <main id="dashboard-section" class="hidden" style="min-height: 100vh; background-color: var(--color-bg);">
        
        <!-- Header do Admin -->
        <header style="background-color: white; border-bottom: 1px solid var(--color-border); padding: var(--spacing-4) 0;">
            <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
                <h1 style="font-size: var(--font-size-xl); color: var(--color-primary); margin: 0;">Painel de Inscrições</h1>
                <button onclick="window.logout()" class="btn" style="padding: var(--spacing-2) var(--spacing-4); border: 1px solid var(--color-border); background: white; color: var(--color-text);">Sair</button>
            </div>
        </header>

        <!-- Conteúdo do Painel -->
        <div class="container" style="padding-top: var(--spacing-6); padding-bottom: var(--spacing-8);">
            
            <!-- Cabeçalho da Lista e Total -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--spacing-6);">
                <h2 style="margin: 0; font-size: var(--font-size-lg);">Inscritos Recentes</h2>
                <div style="background-color: var(--color-primary-light); color: var(--color-primary-dark); padding: var(--spacing-2) var(--spacing-4); border-radius: var(--border-radius); font-weight: bold;">
                    Total: <span id="total-inscritos">0</span>
                </div>
            </div>

            <!-- Tabela de Inscrições -->
            <div id="lista-inscritos" style="background-color: white; border: 1px solid var(--color-border); border-radius: var(--border-radius); overflow-x: auto; margin-bottom: var(--spacing-6);">
                <div style="padding: var(--spacing-8); text-align: center; color: var(--color-text-muted);">
                    Carregando dados...
                </div>
            </div>

            <!-- Container de Detalhes da Inscrição (Oculto) -->
            <div id="detalhe-inscricao" class="hidden" style="background-color: white; border: 1px solid var(--color-border); border-radius: var(--border-radius); padding: var(--spacing-6); margin-top: var(--spacing-6);">
                <!-- Conteúdo detalhado será injetado pelo JS -->
            </div>

        </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
